# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: NSAssetsCLI Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
    - uses: SwiftyLab/setup-swift@latest
    - name: Run tests with coverage
      shell: bash
      run: |
        set -o pipefail
        swift test --enable-code-coverage 2>&1 | tee swift-test.log
        status=${PIPESTATUS[0]}
        echo "swift test exit code: $status" | tee -a swift-test.log
        exit "$status"
    - name: Show failure summary
      if: failure()
      shell: bash
      run: |
        echo "Tail of swift-test.log:"
        tail -n 400 swift-test.log || true
        echo
        echo "Failure markers from swift-test.log:"
        grep -nE "✘|Expectation failed|error:|fatalError|Suite .* failed|Test run with .* failed|unexpected signal|Abort trap|Segmentation fault|swift test exit code:" swift-test.log \
          | grep -v "Info.plist at /tmp/Test.xcresult" \
          | grep -v "xcresult summary failed after" \
          || true
    - name: Upload swift test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: swift-test-log
        path: swift-test.log
    - name: Generate coverage report (lcov)
      run: |
        set -euo pipefail
        BIN_PATH="$(swift build --show-bin-path)"
        TEST_BUNDLE="${BIN_PATH}/NSAssetsCLIPackageTests.xctest/Contents/MacOS/NSAssetsCLIPackageTests"
        PROF_DATA="${BIN_PATH}/codecov/default.profdata"
        xcrun llvm-cov export \
          -format=lcov \
          "${TEST_BUNDLE}" \
          -instr-profile "${PROF_DATA}" \
          > info.lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: michaelversus/aperturecli
        files: info.lcov
        fail_ci_if_error: true
        verbose: true
