# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: NSAssetsCLI Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
    - name: Select latest installed Xcode
      shell: bash
      run: |
        set -euo pipefail
        if [[ -d /Applications/Xcode.app ]]; then
          XCODE_APP="/Applications/Xcode.app"
        else
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
        fi
        if [[ -z "${XCODE_APP}" ]]; then
          echo "No Xcode installation found in /Applications"
          exit 1
        fi

        echo "Using Xcode at: ${XCODE_APP}"
        echo "DEVELOPER_DIR=${XCODE_APP}/Contents/Developer" >> "${GITHUB_ENV}"
        sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
        xcodebuild -version
        swift --version
    - name: Run tests with coverage
      shell: bash
      run: |
        set -o pipefail
        swift test --enable-code-coverage 2>&1 | tee swift-test.log
    - name: Generate coverage report (lcov)
      run: |
        set -euo pipefail
        BIN_PATH="$(swift build --show-bin-path)"
        TEST_BUNDLE="${BIN_PATH}/NSAssetsCLIPackageTests.xctest/Contents/MacOS/NSAssetsCLIPackageTests"
        PROF_DATA="${BIN_PATH}/codecov/default.profdata"
        echo "before xcrun executed"
        xcrun llvm-cov export \
          -format=lcov \
          "${TEST_BUNDLE}" \
          -instr-profile "${PROF_DATA}" \
          > info.lcov
    - name: Collect failure diagnostics
      if: failure()
      shell: bash
      run: |
        echo "Tail of swift-test.log:"
        tail -n 400 swift-test.log || true
        echo
        echo "Recent crash reports:"
        ls -1t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 20 || true
        echo
        echo "Recent NSAssets-related crash report paths:"
        find ~/Library/Logs/DiagnosticReports -maxdepth 1 \( -name 'swift-*' -o -name 'NSAssets*' -o -name 'NSAssetsCLI*' -o -name 'swift-frontend*' \) -type f 2>/dev/null | tail -n 20 || true
    - name: Upload swift test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: swift-test-log
        path: swift-test.log
    - name: Upload crash reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: diagnostic-reports
        path: ~/Library/Logs/DiagnosticReports
        if-no-files-found: ignore
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: michaelversus/aperturecli
        files: info.lcov
        fail_ci_if_error: true
        verbose: true
